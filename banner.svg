<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Statement Reader: turn a messy bank CSV into categorized insight" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="418" rx="20" />
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="20" fill="#F6F6F4" stroke="#E3E3DD" stroke-width="1.5" />

  <g clip-path="url(#frame)">

    <!-- Title block -->
    <text x="56" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#16191D" letter-spacing="-0.5">Statement Reader</text>

    <text font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#6B7380">
      <tspan x="56" y="132">Turn a messy bank CSV into merchant names and categories,</tspan>
      <tspan x="56" y="156">then one honest sentence about where the money went.</tspan>
    </text>

    <!-- Divider seam -->
    <line x1="570" y1="188" x2="570" y2="388" stroke="#E3E3DD" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" />
    <circle cx="570" cy="288" r="23" fill="#1F5F4E" />
    <path d="M 562 275 L 577 288 L 562 301" fill="none" stroke="#F6F6F4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Left: raw statement noise -->
    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#6B7380">
      <text x="56" y="216" transform="rotate(-1.1 56 216)" opacity="0.75">AMZN MKTP US*839201</text>
      <text x="70" y="260" transform="rotate(0.8 70 260)" opacity="0.6">CHIPOTLE #1837</text>
      <text x="52" y="304" transform="rotate(-0.6 52 304)" opacity="0.75">STARBUCKS STORE 10482</text>
      <text x="64" y="348" transform="rotate(1.2 64 348)" opacity="0.55">NEFT TRANSFER TO JOHN</text>
    </g>

    <!-- Right: categorized result -->
    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

      <!-- Food & Dining -->
      <text x="620" y="204" font-size="15" font-weight="600" fill="#16191D">Food &amp; Dining</text>
      <text x="1000" y="204" font-size="14" fill="#6B7380" text-anchor="end">$212</text>
      <rect x="620" y="212" width="380" height="8" rx="4" fill="#E3E3DD" />
      <rect x="620" y="212" width="296" height="8" rx="4" fill="#1F5F4E" />

      <!-- Subscriptions -->
      <text x="620" y="268" font-size="15" font-weight="600" fill="#16191D">Subscriptions</text>
      <text x="1000" y="268" font-size="14" fill="#6B7380" text-anchor="end">$94</text>
      <rect x="620" y="276" width="380" height="8" rx="4" fill="#E3E3DD" />
      <rect x="620" y="276" width="129" height="8" rx="4" fill="#1F5F4E" />

      <!-- Transport, flagged -->
      <text x="620" y="332" font-size="15" font-weight="600" fill="#16191D">Rides</text>
      <text x="1000" y="332" font-size="14" fill="#A85A16" text-anchor="end">$41</text>
      <rect x="620" y="340" width="380" height="8" rx="4" fill="#E3E3DD" />
      <rect x="620" y="340" width="68" height="8" rx="4" fill="#A85A16" />
    </g>

  </g>
</svg>
